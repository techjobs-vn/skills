# plugins/techjobs/skills/techjobs/SKILL.md mirrors https://techjobs.vn/SKILL.md, which is the source of truth.
name: Sync techjobs skill

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live SKILL.md
        run: |
          curl -fsSL https://techjobs.vn/SKILL.md -o /tmp/SKILL.md
          head -1 /tmp/SKILL.md | grep -qx -- '---'
          grep -q '^name: techjobs$' /tmp/SKILL.md
          cp /tmp/SKILL.md plugins/techjobs/skills/techjobs/SKILL.md
          # The directory holds a plugin whose skill names a credential environment variable for review, and
          # the plugin connects over OAuth with .mcp.json, so the plugin copy says "<your API key>" instead.
          sed -i \
            -e 's/stores it in the env var `TECHJOBS_API_KEY` themselves/keeps it themselves, outside the chat/' \
            -e 's/\${env:TECHJOBS_API_KEY}/<your API key>/g' \
            -e 's/\$TECHJOBS_API_KEY/<your API key>/g' \
            plugins/techjobs/skills/techjobs/SKILL.md
          if grep -q TECHJOBS_API_KEY plugins/techjobs/skills/techjobs/SKILL.md; then
            echo "::error::SKILL.md still names TECHJOBS_API_KEY: update the sed rules in this workflow"
            exit 1
          fi
      - name: Commit if changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(techjobs): sync SKILL.md from techjobs.vn"
          git push
